<title>ML LAB Contenuti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: white app shell on a pale ground; left sidebar (logo, nav, dark promo card), content column with greeting + search,
     and on the dashboard a right rail (report chart, goal ring). Soft monochrome palette, round cards, dark pills for what is active. */
  :root {
    --page: #F3F3F7;
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --soft: #EEEFF4;
    --soft-2: #E2E3EA;
    --ink: #222226;
    --ink-muted: #9B9BA6;
    --border: #EDEDF1;
    --shadow: 0 18px 40px -22px rgba(34, 34, 48, .28);
    --dark: #262628;
    --on-dark: #FFFFFF;
    --dark-2: #8E8E95;
    --on-dark-2: #FFFFFF;
    --wave: rgba(255, 255, 255, .14);
    --accent: #262628;
    --accent-ink: #FFFFFF;
    --accent-soft: #EEEFF4;
    --urgent: #D0463B;
    --urgent-soft: #FBE6E4;
    --warning: #B6B6C0;
    --ok: #2E9E6B;
    --ok-soft: #E3F4EB;
    --c-reel: #262628;
    --c-car: #6E6E78;
    --c-post: #A6A6B0;
    --c-story: #CDCDD6;
    --display: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    --body: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0D0D0F; --bg: #151517; --surface: #1C1C1F; --soft: #26262A; --soft-2: #303035;
      --ink: #F1F1F4; --ink-muted: #8D8D97; --border: #29292D; --shadow: 0 18px 40px -22px rgba(0, 0, 0, .7);
      --dark: #ECECEF; --on-dark: #151517; --dark-2: #3A3A40; --on-dark-2: #F1F1F4; --wave: rgba(0, 0, 0, .10);
      --accent: #ECECEF; --accent-ink: #151517; --accent-soft: #26262A;
      --urgent: #FF7A6E; --urgent-soft: #3A1714; --warning: #4A4A52; --ok: #4FD08F; --ok-soft: #12301F;
      --c-reel: #F1F1F4; --c-car: #A9A9B3; --c-post: #6E6E78; --c-story: #48484F;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #0D0D0F; --bg: #151517; --surface: #1C1C1F; --soft: #26262A; --soft-2: #303035;
    --ink: #F1F1F4; --ink-muted: #8D8D97; --border: #29292D; --shadow: 0 18px 40px -22px rgba(0, 0, 0, .7);
    --dark: #ECECEF; --on-dark: #151517; --dark-2: #3A3A40; --on-dark-2: #F1F1F4; --wave: rgba(0, 0, 0, .10);
    --accent: #ECECEF; --accent-ink: #151517; --accent-soft: #26262A;
    --urgent: #FF7A6E; --urgent-soft: #3A1714; --warning: #4A4A52; --ok: #4FD08F; --ok-soft: #12301F;
    --c-reel: #F1F1F4; --c-car: #A9A9B3; --c-post: #6E6E78; --c-story: #48484F;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--page); color: var(--ink); font-family: var(--body); font-size: 14px; -webkit-font-smoothing: antialiased; padding-inline: 24px; padding-block: 28px; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; font-weight: 600; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .muted { color: var(--ink-muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- shell ---------- */
  .app { max-width: 1320px; margin: 0 auto; background: var(--bg); border-radius: 28px; box-shadow: 0 30px 70px -40px rgba(34, 34, 48, .35); display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 56px); }
  .side { border-right: 1px solid var(--border); padding: 34px 20px 24px; display: flex; flex-direction: column; gap: 34px; }
  .side-in { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 34px; }
  .logo { display: flex; align-items: center; gap: 6px; justify-content: center; padding-top: 4px; }
  .logo i { display: block; width: 17px; height: 17px; background: var(--ink); }
  .logo i:nth-child(2) { border-radius: 50%; }
  .logo i:nth-child(3) { background: none; width: 0; height: 0; border-left: 16px solid var(--ink); border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
  .logo b { margin-left: 8px; font-weight: 600; font-size: 14px; letter-spacing: .02em; }
  nav.tabs { display: flex; flex-direction: column; gap: 6px; }
  nav.tabs button { display: flex; align-items: center; gap: 14px; border: none; background: none; padding: 12px 16px; border-radius: 12px; font-weight: 500; font-size: 13.5px; color: var(--ink-muted); cursor: pointer; text-align: left; white-space: nowrap; }
  nav.tabs button svg { width: 18px; height: 18px; flex: none; fill: currentColor; }
  nav.tabs button:hover { color: var(--ink); background: var(--soft); }
  nav.tabs button.on { background: var(--dark); color: var(--on-dark); }
  .promo { background: var(--dark); color: var(--on-dark); border-radius: 20px; padding: 22px 18px 0; text-align: center; display: grid; gap: 14px; justify-items: center; position: relative; margin-bottom: 22px; }
  .promo p { margin: 0; font-size: 13px; line-height: 1.45; font-weight: 500; }
  .promo .art { width: 100%; height: 92px; position: relative; }
  .promo .art span { position: absolute; border-radius: 50%; background: var(--dark-2); }
  .promo .art .a { width: 64px; height: 64px; left: 50%; top: 10px; transform: translateX(-50%); background: var(--on-dark); opacity: .92; }
  .promo .art .a::after { content: ""; position: absolute; left: 26px; top: 20px; border-left: 18px solid var(--dark); border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
  .promo .art .b { width: 26px; height: 26px; left: 16%; top: 48px; opacity: .8; }
  .promo .art .c { width: 16px; height: 16px; right: 18%; top: 14px; opacity: .6; }
  .promo .art .d { width: 10px; height: 10px; right: 26%; top: 70px; opacity: .5; }
  .promo button { transform: translateY(50%); border: none; background: var(--dark-2); color: var(--on-dark-2); padding: 12px 26px; border-radius: 14px; font-weight: 500; cursor: pointer; box-shadow: var(--shadow); }
  .promo button:hover { filter: brightness(1.08); }
  .sync { font-size: 11.5px; color: var(--ink-muted); display: flex; align-items: center; gap: 8px; justify-content: center; }
  .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-muted); display: inline-block; }
  .sync.on i { background: var(--ok); }

  .content { padding: 34px 36px 60px; min-width: 0; }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 28px; }
  .hello h1 { font-size: clamp(26px, 3.4vw, 34px); line-height: 1.1; }
  .hello p { margin: 6px 0 0; color: var(--ink-muted); font-size: 13px; }
  .tools { display: flex; align-items: center; gap: 12px; }
  .search { position: relative; width: 260px; max-width: 100%; }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: var(--ink); }
  .search input { width: 100%; border: none; background: var(--soft); border-radius: 14px; padding: 13px 16px 13px 44px; font-size: 13px; }
  .search input::placeholder { color: var(--ink); opacity: .8; }
  .sres { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 6px; z-index: 40; max-height: 340px; overflow: auto; border: 1px solid var(--border); }
  .sres button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: none; background: none; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
  .sres button:hover { background: var(--soft); }
  .sres .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 500; }
  .sres .k { font-size: 11px; color: var(--ink-muted); }
  .sres .none { padding: 12px; font-size: 12.5px; color: var(--ink-muted); text-align: center; }
  .sq { width: 46px; height: 46px; border-radius: 14px; background: var(--soft); border: none; display: grid; place-items: center; cursor: pointer; flex: none; }
  .sq svg { width: 18px; height: 18px; fill: var(--ink); }
  .sq:hover { background: var(--soft-2); }
  .avatar { width: 46px; height: 46px; border-radius: 14px; background: var(--dark); color: var(--on-dark); display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }

  @media (max-width: 900px) {
    body { padding: 0; }
    .app { grid-template-columns: minmax(0, 1fr); border-radius: 0; min-height: 100vh; box-shadow: none; }
    .side { border-right: none; border-bottom: 1px solid var(--border); padding: 16px 16px 10px; gap: 12px; }
    .side-in { position: static; gap: 12px; }
    .logo { justify-content: flex-start; }
    nav.tabs { flex-direction: row; overflow-x: auto; scrollbar-width: none; gap: 4px; }
    nav.tabs button { padding: 10px 14px; gap: 8px; }
    .promo { display: none; }
    .sync { justify-content: flex-start; }
    .content { padding: 22px 16px 60px; }
    .search { width: auto; flex: 1 1 200px; }
    .tools { flex: 1 1 100%; }
  }

  /* ---------- controls ---------- */
  .btn { border: none; background: var(--soft); padding: 11px 18px; border-radius: 14px; font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--soft-2); }
  .btn.primary { background: var(--dark); color: var(--on-dark); }
  .btn.primary:hover { filter: brightness(1.15); background: var(--dark); }
  .btn.ghost { background: none; }
  .btn.ghost:hover { background: var(--soft); }
  .btn.small { padding: 7px 13px; font-size: 12px; border-radius: 10px; }
  .btn.danger { color: var(--urgent); }
  .btn.danger.armed { background: var(--urgent); color: #fff; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .iconbtn { border: none; background: none; cursor: pointer; padding: 5px 7px; border-radius: 8px; color: var(--ink-muted); font-size: 14px; line-height: 1; }
  .iconbtn:hover { background: var(--soft); color: var(--ink); }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
  .bar .grow { flex: 1 1 180px; min-width: 0; }
  .field { border: 1px solid transparent; background: var(--soft); border-radius: 12px; padding: 11px 14px; width: 100%; font-size: 13.5px; }
  .field:focus { border-color: var(--ink-muted); outline: none; }
  .bar .field { width: auto; }
  .bar .grow.field { width: 100%; }
  select.field { cursor: pointer; }
  textarea.field { resize: vertical; min-height: 84px; line-height: 1.55; }

  .sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 30px 0 14px; flex-wrap: wrap; }
  .sec-title h2 { font-size: 17px; }
  .sec-title .muted { font-size: 12.5px; }

  .panel { border-radius: 22px; padding: 22px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--border); min-width: 0; }
  .panel h3 { font-size: 16px; margin-bottom: 4px; }
  .panel .hint { font-size: 12px; color: var(--ink-muted); margin: 0 0 16px; line-height: 1.5; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

  /* ---------- dashboard ---------- */
  .dash { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
  .rail { display: grid; gap: 22px; }
  @media (max-width: 1180px) { .dash { grid-template-columns: minmax(0, 1fr); } .rail { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); } }

  .banner { background: var(--soft); border-radius: 22px; padding: 24px 26px; display: flex; justify-content: space-between; align-items: center; gap: 18px; position: relative; overflow: hidden; min-height: 150px; }
  .banner h2 { font-size: 19px; line-height: 1.3; max-width: 24ch; }
  .banner p { margin: 6px 0 16px; font-size: 12.5px; color: var(--ink-muted); max-width: 42ch; }
  .banner .acts { display: flex; gap: 0; align-items: center; }
  .rb { width: 44px; height: 44px; border-radius: 50%; border: none; display: grid; place-items: center; cursor: pointer; background: var(--soft-2); }
  .rb + .rb { margin-left: -8px; background: var(--surface); box-shadow: 0 8px 18px -8px rgba(0,0,0,.35); }
  .rb svg { width: 18px; height: 18px; fill: var(--ink); }
  .rb:hover { filter: brightness(.97); }
  .banner .deco { position: relative; width: 190px; height: 130px; flex: none; }
  .banner .deco span { position: absolute; border-radius: 50%; }
  .banner .deco .ph { left: 50%; top: 4px; transform: translateX(-50%) rotate(-8deg); width: 74px; height: 128px; border-radius: 14px; background: var(--dark); box-shadow: var(--shadow); }
  .banner .deco .ph::before { content: ""; position: absolute; inset: 8px 7px 16px; border-radius: 9px; background: var(--dark-2); }
  .banner .deco .ph::after { content: ""; position: absolute; left: 31px; top: 50px; border-left: 16px solid var(--on-dark-2); border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
  .banner .deco .o1 { width: 34px; height: 34px; left: 14px; top: 10px; background: var(--soft-2); }
  .banner .deco .o2 { width: 20px; height: 20px; right: 12px; bottom: 16px; background: var(--ink-muted); opacity: .4; }
  .banner .deco .o3 { width: 52px; height: 52px; right: 4px; top: -6px; background: var(--surface); }
  @media (max-width: 560px) { .banner .deco { display: none; } }

  .periods { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 26px 0 18px; }
  .periods .grow { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: none; background: var(--soft); border-radius: 10px; padding: 8px 13px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--ink-muted); }
  .chip:hover { color: var(--ink); }
  .chip.on { background: var(--dark); color: var(--on-dark); }

  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 20px; }
  @media (max-width: 760px) { .pair { grid-template-columns: minmax(0, 1fr); } }
  .acts-list { display: grid; gap: 4px; }
  .act { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 6px; border-radius: 12px; cursor: pointer; }
  .act:hover { background: var(--soft); }
  .act .t { font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act .s { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
  .ring { width: 42px; height: 42px; border-radius: 50%; background: var(--dark); color: var(--on-dark); display: grid; place-items: center; font-size: 10.5px; font-weight: 600; box-shadow: 0 0 0 3px var(--surface), 0 0 0 4.5px var(--dark); margin: 4px; font-variant-numeric: tabular-nums; }

  .cards { display: grid; gap: 16px; }
  .kc { position: relative; overflow: hidden; border-radius: 22px; padding: 20px 22px; background: var(--dark); color: var(--on-dark); min-height: 150px; display: grid; align-content: space-between; gap: 14px; box-shadow: var(--shadow); }
  .kc.alt { background: var(--dark-2); color: var(--on-dark-2); }
  .kc svg.wave { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .kc svg.wave path { fill: var(--wave); }
  .kc > * { position: relative; }
  .kc .l { font-size: 11.5px; opacity: .8; }
  .kc .big { font-size: 30px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .kc .big small { font-size: 12px; font-weight: 500; opacity: .85; }
  .kc .digits { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-variant-numeric: tabular-nums; }
  .kc .digits b { display: block; font-weight: 500; font-size: 14px; }
  .kc .digits span { font-size: 10.5px; opacity: .7; }

  .delta { font-size: 11.5px; font-weight: 600; }
  .delta.up { color: var(--ok); } .delta.down { color: var(--urgent); }
  .kc .delta { color: inherit; opacity: .9; }

  .insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .insight { border-radius: 18px; padding: 16px 18px; background: var(--soft); }
  .insight .k { font-size: 11px; color: var(--ink-muted); font-weight: 500; }
  .insight .v { font-weight: 600; font-size: 17px; margin-top: 6px; line-height: 1.3; }
  .insight .s { font-size: 11.5px; color: var(--ink-muted); margin-top: 4px; line-height: 1.45; }

  .rhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .rhead h3 { margin: 0; }
  .rhead select { border: none; background: var(--soft); border-radius: 12px; padding: 9px 12px; font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { fill: var(--ink-muted); font: 10px var(--body); }
  .chart .tip rect { fill: var(--soft); }
  .chart .tip text { fill: var(--ink); }
  .chart .tip .tk { fill: var(--ink-muted); font-size: 9px; }
  .chart .pillx rect { fill: var(--dark); }
  .chart .pillx text { fill: var(--on-dark); }

  .donut { display: grid; justify-items: center; gap: 18px; }
  .donut svg { width: 170px; height: 170px; }
  .donut .ctr { font-size: 32px; font-weight: 500; fill: var(--ink); font-family: var(--body); }
  .donut .ctr tspan { font-size: 13px; }
  .donut .sub { font-size: 10.5px; fill: var(--ink-muted); font-family: var(--body); }
  .legend-list { width: 100%; display: grid; gap: 12px; }
  .legend-list div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 13px; font-weight: 500; }
  .legend-list i { width: 7px; height: 7px; border-radius: 50%; background: var(--fmt); }
  .legend-list b { font-weight: 600; font-variant-numeric: tabular-nums; }

  .hbars { display: grid; gap: 12px; }
  .hbar { display: grid; grid-template-columns: minmax(0, 120px) minmax(0, 1fr) 52px; gap: 10px; align-items: center; font-size: 12.5px; }
  .hbar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .track { height: 8px; border-radius: 6px; background: var(--soft); overflow: hidden; }
  .hbar .fill { height: 100%; border-radius: 6px; background: var(--dark); }
  .hbar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

  .cadence { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; align-items: end; }
  .cadence .wk { display: grid; gap: 5px; justify-items: center; font-size: 10.5px; color: var(--ink-muted); }
  .cadence .col { width: 100%; max-width: 30px; height: 70px; background: var(--soft); border-radius: 8px; position: relative; overflow: hidden; }
  .cadence .col b { position: absolute; left: 0; right: 0; bottom: 0; background: var(--dark); border-radius: 8px 8px 0 0; }
  .cadence .col.short b { background: var(--warning); }
  .cadence .col .goal { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--ink-muted); }

  /* ---------- shared bits ---------- */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--ink); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--fmt, var(--ink-muted)); box-shadow: 0 0 0 1px var(--ink-muted) inset; }
  .er { font-weight: 600; font-variant-numeric: tabular-nums; }
  .er.hi { color: var(--ok); } .er.lo { color: var(--urgent); }

  .tablewrap { overflow-x: auto; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 880px; }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 11px; color: var(--ink-muted); font-weight: 500; cursor: pointer; user-select: none; white-space: nowrap; background: var(--surface); }
  th.sorted { color: var(--ink); }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--soft); }
  .ttl { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

  .empty { background: var(--soft); border-radius: 20px; padding: 30px 22px; text-align: center; color: var(--ink-muted); display: grid; gap: 10px; justify-items: center; }
  .empty strong { color: var(--ink); font-size: 15px; font-weight: 600; }
  .empty p { margin: 0; max-width: 52ch; line-height: 1.55; font-size: 13px; }

  .kanban { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
  .kcol { background: var(--soft); border: 1.5px solid transparent; border-radius: 20px; padding: 14px; display: grid; gap: 10px; align-content: start; min-height: 170px; }
  .kcol.drop { border-color: var(--ink-muted); }
  .kcol h3 { font-size: 13px; display: flex; justify-content: space-between; gap: 8px; padding: 2px 4px 4px; }

<script>
(function () {
  'use strict';

  // ---------- costanti ----------
  var FORMATI = ['Reel', 'Carosello', 'Post', 'Storia'];
  var FMT_VAR = { Reel: 'var(--c-reel)', Carosello: 'var(--c-car)', Post: 'var(--c-post)', Storia: 'var(--c-story)' };
  var STATI = [
    { id: 'idea', nome: 'Idea' },
    { id: 'registrare', nome: 'Da registrare' },
    { id: 'montaggio', nome: 'In montaggio' },
    { id: 'programmato', nome: 'Programmato' },
    { id: 'pubblicato', nome: 'Pubblicato' }
  ];
  var TIPI_SPUNTO = ['Hook', 'Domanda di un cliente', 'Trend', 'Da un altro profilo', 'Ispirazione'];
  var DEFAULT_SETTINGS = {
    nome: 'Mattia',
    handle: '',
    pilastri: ['Allenamento', 'Postura', 'Nutrizione', 'Risultati clienti', 'Mindset', 'Dietro le quinte'],
    pubblico: '',
    obiettivo: '',
    frequenza: 4
  };
  var KEYS = ['posts', 'ideas', 'spunti', 'crescita', 'settings'];
  var LS_KEY = 'mllab-contenuti-v1';

  // ---------- stato ----------
  var state = { posts: [], ideas: [], spunti: [], crescita: [], settings: clone(DEFAULT_SETTINGS) };
  var ui = { tab: 'panoramica', periodo: 30, q: '', fFmt: '', fPil: '', sort: 'data', dir: -1, calY: 0, calM: 0, spTipo: '', aiIdeas: [], aiBusy: false, aiText: '', aiTextBusy: false, fRange: 180 };
  var db = null, sample = null, downloads = null;
  var dirty = {}, writing = {}, timers = {};

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function n(v) { var x = Number(v); return isFinite(x) ? x : 0; }
  function fmtN(v) { v = n(v); if (Math.abs(v) >= 10000) return (v / 1000).toLocaleString('it-IT', { maximumFractionDigits: 1 }) + 'k'; return Math.round(v).toLocaleString('it-IT'); }
  function pct(v) { return (v * 100).toLocaleString('it-IT', { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + '%'; }
  function todayISO() { var d = new Date(); return iso(d); }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function parseISO(s) { var p = String(s || '').split('-'); return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1); }
  function fmtDate(s) { if (!s) return '—'; return parseISO(s).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: '2-digit' }); }
  function daysAgo(k) { var d = new Date(); d.setDate(d.getDate() - k); return iso(d); }
  function fmtPill(f) { return '<span class="pill" style="--fmt:' + (FMT_VAR[f] || 'var(--ink-muted)') + '"><i></i>' + esc(f || '—') + '</span>'; }

  // ---------- metriche ----------
  function interazioni(p) { return n(p.like) + n(p.commenti) + n(p.condivisioni) + n(p.salvataggi); }
  function base(p) { return n(p.reach) || n(p.views); }
  function er(p) { var b = base(p); return b ? interazioni(p) / b : 0; }
  function avg(arr, f) { if (!arr.length) return 0; var s = 0; arr.forEach(function (x) { s += f(x); }); return s / arr.length; }
  function postsIn(from, to) { return state.posts.filter(function (p) { return p.data >= from && (!to || p.data <= to); }); }
  function erClass(v, ref) { if (!ref) return ''; return v >= ref * 1.25 ? 'hi' : v <= ref * .7 ? 'lo' : ''; }

  // ---------- persistenza ----------
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      KEYS.forEach(function (k) { if (d[k]) state[k] = d[k]; });
      state.settings = Object.assign(clone(DEFAULT_SETTINGS), state.settings);
    } catch (e) {}
  }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
  function docBody(k) { return k === 'settings' ? clone(state.settings) : { items: state[k] }; }

  function save(k) {
    saveLocal();
    if (!db) return;
    dirty[k] = true;
    clearTimeout(timers[k]);
    timers[k] = setTimeout(function () { flush(k); }, 700);
  }
  function flush(k) {
    if (writing[k]) { timers[k] = setTimeout(function () { flush(k); }, 400); return; }
    writing[k] = true;
    var body = docBody(k);
    db.doc('app/' + k).set(body).then(function () {
      writing[k] = false; dirty[k] = false; setSync(true);
    }, function (e) {
      writing[k] = false;
      if (e && e.code === 'quota_exceeded') toast('Spazio pieno: esporta un backup ed elimina i contenuti più vecchi.');
      else if (e && e.code === 'invalid_argument') { toast('Non hai i permessi per modificare questi dati.'); dirty[k] = false; }
      else setTimeout(function () { flush(k); }, 1500 + Math.random() * 1000);
    });
  }
  function setSync(on) {
    var el = document.getElementById('sync');
    el.className = 'sync' + (on ? ' on' : '');
    el.querySelector('span').textContent = on ? 'Sincronizzato su tutti i dispositivi' : 'Salvato solo su questo dispositivo';
  }

  function connect() {
    if (!window.claude || typeof window.claude.use !== 'function') { setSync(false); return; }
    window.claude.use('db').then(function (d) {
      if (!d) { setSync(false); return; }
      db = d; setSync(true);
      KEYS.forEach(function (k) {
        var first = true;
        db.doc('app/' + k).onSnapshot(function (snap) {
          if (dirty[k] || writing[k]) return;
          if (!snap.exists) {
            if (first) {
              var hasLocal = k === 'settings' ? !!state.settings.handle : state[k].length > 0;
              if (hasLocal) save(k);
            }
            first = false; return;
          }
          first = false;
          var data = snap.data();
          if (k === 'settings') state.settings = Object.assign(clone(DEFAULT_SETTINGS), clone(data));
          else state[k] = Array.isArray(data.items) ? clone(data.items) : [];
          saveLocal();
          renderSoft();
        }, function () { setSync(false); });
      });
    }, function () { setSync(false); });
    window.claude.use('sample').then(function (s) { sample = s; if (s) renderSoft(); }, function () {});
    window.claude.use('downloads').then(function (d) { downloads = d; if (d) renderSoft(); }, function () {});
  }

  // Re-render without destroying an open modal or focused input in the view.
  function renderSoft() {
    var a = document.activeElement;
    if (a && document.getElementById('view').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    render();
  }

  // ---------- UI helpers ----------
  function toast(msg) {
    var r = document.getElementById('toastRoot');
    r.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
    clearTimeout(toast.t); toast.t = setTimeout(function () { r.innerHTML = ''; }, 2800);
  }
  function opts(list, sel, empty) {
    return (empty != null ? '<option value="">' + esc(empty) + '</option>' : '') + list.map(function (x) { return '<option' + (x === sel ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
  }
  function armDelete(btn, fn) {
    btn.addEventListener('click', function () {
      if (btn.classList.contains('armed')) { fn(); return; }
      btn.classList.add('armed'); btn.textContent = 'Conferma eliminazione';
      setTimeout(function () { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = 'Elimina'; } }, 4000);
    });
  }
  function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
  function openModal(html, bind) {
    var root = document.getElementById('modalRoot');
    root.innerHTML = '<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
    var ov = root.querySelector('#ov');
    ov.addEventListener('mousedown', function (e) { if (e.target === ov) closeModal(); });
    root.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeModal); });
    bind(root.querySelector('.modal'));
    var f = root.querySelector('input, textarea, select'); if (f) f.focus();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  function val(m, id) { var el = m.querySelector('#' + id); return el ? el.value.trim() : ''; }

  function saveFile(filename, data, label) {
    if (!downloads) { toast('Il salvataggio di file è disponibile aprendo l\'app su claude.ai.'); return; }
    downloads.save({ filename: filename, data: data }).then(function (r) {
      if (r && r.status === 'saved') toast(label + ' salvato');
    }, function (e) { if (e && e.code !== 'cancelled') toast('File non salvato: ' + (e.message || e.code)); });
  }

  // ---------- tabs ----------
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (!b) return;
    setTab(b.dataset.tab);
  });
  function setTab(t) {
    ui.tab = t;
    document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === t); });
    try { localStorage.setItem(LS_KEY + '-tab', t); } catch (e) {}
    try { history.replaceState(null, '', '#' + t); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }

  var TAB_INFO = {
    contenuti: ['Contenuti', 'Monitoraggio di ogni post e reel pubblicato'],
    idee: ['Idee', 'Dalla prima idea al contenuto pubblicato'],
    calendario: ['Calendario', 'Il piano editoriale del mese'],
    spunti: ['Spunti', 'Hook, domande dei clienti e ispirazioni da non perdere'],
    impostazioni: ['Impostazioni', 'Profilo, pilastri e backup']
  };
  function render() {
    var h = state.settings.handle, nome = state.settings.nome || 'Mattia';
    var info = TAB_INFO[ui.tab];
    document.getElementById('hello').textContent = info ? info[0] : 'Ciao, ' + nome;
    document.getElementById('hdrHandle').textContent = info ? info[1] : 'Bentornato' + (h ? ' · @' + h.replace(/^@/, '') : '');
    document.querySelector('.avatar').textContent = (nome.trim()[0] || 'M').toUpperCase() + (h ? (h.replace(/^@/, '')[0] || '').toUpperCase() : 'L');
    var v = document.getElementById('view');
    ({ panoramica: renderPanoramica, contenuti: renderContenuti, idee: renderIdee, calendario: renderCalendario, spunti: renderSpunti, impostazioni: renderImpostazioni }[ui.tab] || renderPanoramica)(v);
  }

  // =====================================================================
  // PANORAMICA
  // =====================================================================
  var ICON = {
    plus: '<svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>',
    cal: '<svg viewBox="0 0 24 24"><path d="M7 2h2v3H7zm8 0h2v3h-2zM3 5h18v16H3zm2 5v9h14v-9z"/></svg>'
  };
  function waveSvg(alt) {
    return '<svg class="wave" viewBox="0 0 300 170" preserveAspectRatio="none" aria-hidden="true">' +
      (alt ? '<path d="M300 0 H190 C215 50 250 90 300 96 Z"/><path d="M0 170 V120 C70 95 150 120 200 170 Z"/>'
           : '<path d="M300 0 H150 C190 70 240 110 300 120 Z"/><path d="M300 170 V150 C260 130 230 140 205 170 Z"/>') + '</svg>';
  }
  function deltaTxt(curV, prevV, hasPrev) {
    if (!hasPrev || !prevV) return '';
    var diff = (curV - prevV) / prevV;
    if (Math.abs(diff) < .005) return '';
    return '<span class="delta ' + (diff > 0 ? 'up' : 'down') + '">' + (diff > 0 ? '▲' : '▼') + ' ' + Math.abs(Math.round(diff * 100)) + '%</span>';
  }

  function renderPanoramica(v) {
    var P = ui.periodo;
    var cur = postsIn(daysAgo(P - 1));
    var prev = postsIn(daysAgo(2 * P - 1), daysAgo(P));
    var cres = state.crescita.slice().sort(function (a, b) { return a.data < b.data ? -1 : 1; });
    var last = cres[cres.length - 1];
    var startF = null;

  function smoothPath(p) {
    var d = 'M' + p[0][0].toFixed(1) + ' ' + p[0][1].toFixed(1);
    for (var i = 0; i < p.length - 1; i++) {
      var p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
      d += ' C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + ' ' +
        (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return d;
  }
  var MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
  function followerChart(cres, range) {
    var pts = cres.filter(function (c) { return c.data >= daysAgo(range); });
    if (pts.length < 2) pts = cres.slice(-2);
    if (pts.length < 2) return '<div class="empty" style="padding:22px"><p>' + (cres.length ? 'Serve almeno un secondo dato per disegnare la curva.' : 'Aggiungi il numero di follower di oggi con «Aggiorna follower».') + '</p></div>';
    var W = 300, H = 230, L = 34, R = 10, T = 18, B = 36;
    var xs = pts.map(function (p) { return parseISO(p.data).getTime(); });
    var ys = pts.map(function (p) { return n(p.follower); });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var pad = Math.max(1, (y1 - y0) * .25); y0 = Math.max(0, Math.floor(y0 - pad)); y1 = Math.ceil(y1 + pad);
    var X = function (t) { return L + (x1 === x0 ? 0 : (t - x0) / (x1 - x0)) * (W - L - R); };
    var Y = function (v) { return T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); };
    var P = pts.map(function (p, i) { return [X(xs[i]), Y(ys[i])]; });
    var line = smoothPath(P);
    var area = line + ' L' + P[P.length - 1][0].toFixed(1) + ' ' + (H - B) + ' L' + P[0][0].toFixed(1) + ' ' + (H - B) + ' Z';
    var g = '';
    for (var k = 0; k <= 3; k++) {
      var gv = y0 + (y1 - y0) * k / 3, gy = Y(gv);
      g += '<text x="0" y="' + (gy + 3).toFixed(1) + '">' + fmtN(gv) + '</text>';
    }
    // month labels
    var d0 = new Date(x0), d1 = new Date(x1), months = [];
    var m = new Date(d0.getFullYear(), d0.getMonth(), 1);
    while (m <= d1) { months.push(new Date(m)); m.setMonth(m.getMonth() + 1); }
    var step = Math.ceil(months.length / 6);
    var lastM = months[months.length - 1];
    var labels = months.filter(function (mm, i) { return (months.length - 1 - i) % step === 0; }).map(function (mm) {
      var mid = new Date(mm.getFullYear(), mm.getMonth(), 15).getTime();
      var cx = Math.max(L + 12, Math.min(W - R - 12, X(Math.max(x0, Math.min(x1, mid)))));
      var on = mm === lastM;
      return on ? '<g class="pillx"><rect x="' + (cx - 17).toFixed(1) + '" y="' + (H - 24) + '" width="34" height="18" rx="6"/><text x="' + cx.toFixed(1) + '" y="' + (H - 11.5) + '" text-anchor="middle">' + MESI[mm.getMonth()] + '</text></g>'
        : '<text x="' + cx.toFixed(1) + '" y="' + (H - 11.5) + '" text-anchor="middle">' + MESI[mm.getMonth()] + '</text>';
    }).join('');
    var lp = P[P.length - 1];
    var tw = 84, th = 36, tx = Math.max(L, Math.min(W - R - tw, lp[0] - tw - 8)), ty = Math.max(0, lp[1] - th - 10);
    var tip = '<g class="tip"><rect x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" width="' + tw + '" height="' + th + '" rx="9"/>' +
      '<text class="tk" x="' + (tx + 10).toFixed(1) + '" y="' + (ty + 14).toFixed(1) + '">' + esc(fmtDate(pts[pts.length - 1].data)) + '</text>' +
      '<text x="' + (tx + 10).toFixed(1) + '" y="' + (ty + 28).toFixed(1) + '" style="font-size:12px;font-weight:600">' + fmtN(ys[ys.length - 1]) + '</text></g>';
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Andamento dei follower">' + g +
      '<path d="' + area + '" fill="var(--ink)" fill-opacity=".04"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' + tip +
      '<circle cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1) + '" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>' + labels + '</svg>';
  }

  function goalRing() {
    var now = new Date(), ym = iso(now).slice(0, 7);
    var dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    var goal = Math.max(1, Math.round(Math.max(1, n(state.settings.frequenza)) * dim / 7));
    var month = state.posts.filter(function (p) { return (p.data || '').slice(0, 7) === ym; });
    var feed = month.filter(function (p) { return p.formato !== 'Storia'; });
    var ratio = feed.length / goal, shown = Math.min(1, ratio);
    var r = 62, C = 2 * Math.PI * r, gap = feed.length > 1 ? 3 : 0;
    var off = 0, arcs = '', dots = '';
    ['Reel', 'Carosello', 'Post'].forEach(function (f) {
      var c = feed.filter(function (p) { return p.formato === f; }).length;
      if (!c) return;
      var len = Math.min(c / goal, 1 - off / C) * C;
      if (len <= 0) return;
      arcs += '<circle cx="85" cy="85" r="' + r + '" fill="none" stroke="' + FMT_VAR[f] + '" stroke-width="16" stroke-dasharray="' + Math.max(0, len - gap).toFixed(1) + ' ' + C.toFixed(1) + '" stroke-dashoffset="' + (-off).toFixed(1) + '" transform="rotate(-90 85 85)"/>';
      off += len;
      var a = off / C * 2 * Math.PI - Math.PI / 2;
      if (off < C - 1) dots += '<circle cx="' + (85 + r * Math.cos(a)).toFixed(1) + '" cy="' + (85 + r * Math.sin(a)).toFixed(1) + '" r="2.6" fill="var(--surface)"/>';
    });
    var mname = now.toLocaleDateString('it-IT', { month: 'long' });
    var legend = FORMATI.map(function (f) {
      var list = month.filter(function (p) { return p.formato === f; });
      return '<div style="--fmt:' + FMT_VAR[f] + '"><i></i><span>' + f + ' <span class="muted" style="font-weight:400">· ' + list.length + '</span></span><b>' + (list.some(base) ? pct(avg(list.filter(base), er)) : '—') + '</b></div>';
    }).join('');
    return '<section class="panel"><div class="rhead"><h3>Obiettivo di ' + esc(mname) + '</h3><span class="muted num" style="font-size:12px">' + feed.length + ' / ' + goal + '</span></div><div class="donut">' +
      '<svg viewBox="0 0 170 170" role="img" aria-label="' + Math.round(ratio * 100) + '% dell\'obiettivo mensile"><circle cx="85" cy="85" r="' + r + '" fill="none" stroke="var(--soft)" stroke-width="16"/>' + arcs + dots +
      '<text class="ctr" x="85" y="88" text-anchor="middle">' + Math.round(ratio * 100) + '<tspan>%</tspan></text><text class="sub" x="85" y="106" text-anchor="middle">contenuti nel feed</text></svg>' +
      '<div class="legend-list">' + legend + '</div><p class="hint" style="margin:0;text-align:center">Engagement medio per formato nel mese. Obiettivo: ' + n(state.settings.frequenza) + ' a settimana.</p></div></section>';
  }

  function weekStart(d) { var x = new Date(d); var g = (x.getDay() + 6) % 7; x.setDate(x.getDate() - g); x.setHours(0, 0, 0, 0); return x; }
  function cadence() {
    var goal = Math.max(1, n(state.settings.frequenza));
    var ws = weekStart(new Date());
    var weeks = [];
    for (var i = 7; i >= 0; i--) { var s = new Date(ws); s.setDate(s.getDate() - 7 * i); var e = new Date(s); e.setDate(e.getDate() + 6); weeks.push({ s: iso(s), e: iso(e), lab: s.getDate() + '/' + (s.getMonth() + 1) }); }
    var counts = weeks.map(function (w) { return state.posts.filter(function (p) { return p.data >= w.s && p.data <= w.e && p.formato !== 'Storia'; }).length; });
    var max = Math.max(goal * 1.5, Math.max.apply(null, counts), 1);
    return '<div class="cadence">' + weeks.map(function (w, i) {
      var c = counts[i], cur = i === weeks.length - 1;
      return '<div class="wk"><span class="num" style="color:var(--ink);font-weight:600">' + c + '</span><div class="col' + (c < goal && !cur ? ' short' : '') + '"><b style="height:' + (c / max * 100).toFixed(0) + '%"></b><span class="goal" style="bottom:' + (goal / max * 100).toFixed(0) + '%"></span></div><span>' + (cur ? 'ora' : w.lab) + '</span></div>';
    }).join('') + '</div>';
  }

  function groupBars(list, key) {
    var g = {};
    list.forEach(function (p) { var k = key(p) || 'Senza pilastro'; (g[k] = g[k] || []).push(p); });
    var rows = Object.keys(g).map(function (k) { return { k: k, v: avg(g[k], er), c: g[k].length }; }).sort(function (a, b) { return b.v - a.v; });
    if (!rows.length) return '<div class="empty" style="padding:20px"><p>Assegna un pilastro ai contenuti per confrontarli.</p></div>';
    var max = Math.max.apply(null, rows.map(function (r) { return r.v; })) || 1;
    return '<div class="hbars">' + rows.map(function (r) {
      return '<div class="hbar"><span class="lab" title="' + esc(r.k) + '">' + esc(r.k) + ' <span class="muted">(' + r.c + ')</span></span><span class="track"><span class="fill" style="display:block;width:' + (r.v / max * 100).toFixed(0) + '%"></span></span><span class="v">' + pct(r.v) + '</span></div>';
    }).join('') + '</div>';
  }

  // ---------- ricerca globale ----------
  (function () {

  // ---- CSV ----
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    var firstLine = text.split(/\r?\n/)[0] || '';
    var delim = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : (firstLine.split('\t').length > firstLine.split(',').length ? '\t' : ',');
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return x.trim() !== ''; }); });
  }
  var SYN = {
    data: ['publish time', 'ora di pubblicazione', 'data di pubblicazione', 'data', 'date', 'orario di pubblicazione'],
    titolo: ['description', 'descrizione', 'titolo', 'caption', 'didascalia', 'title'],
    formato: ['post type', 'tipo di post', 'tipo di contenuto', 'tipo', 'formato', 'type'],
    link: ['permalink', 'link', 'url'],
    views: ['views', 'visualizzazioni', 'plays', 'riproduzioni', 'impressions', 'impressioni'],
    reach: ['reach', 'copertura', 'account raggiunti', 'accounts reached'],
    like: ['likes', 'mi piace', 'like'],
    commenti: ['comments', 'commenti'],
    condivisioni: ['shares', 'condivisioni'],
    salvataggi: ['saves', 'salvataggi', 'elementi salvati', 'salvati'],
    follow: ['follows', 'follow', 'nuovi follower', 'follower acquisiti'],
    pilastro: ['pilastro', 'categoria', 'rubrica']
  };
  function normH(h) { return h.toLowerCase().replace(/\s+/g, ' ').replace(/[^a-zà-ù ]/g, '').trim(); }
  function mapHeaders(hdr) {
    var map = {}, used = {};
    var H = hdr.map(normH);
    Object.keys(SYN).forEach(function (k) {
      for (var s = 0; s < SYN[k].length; s++) {
        var idx = H.indexOf(SYN[k][s]);
        if (idx >= 0 && !used[idx]) { map[k] = idx; used[idx] = 1; return; }
      }
    });
    return { map: map, italian: H.some(function (h) { return /pubblicazione|copertura|visualizzazioni|commenti/.test(h); }) };
  }
  function parseNum(s) { s = String(s || '').trim(); if (!s) return ''; s = s.replace(/\s/g, ''); if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); s = s.replace(/,(\d{3})(?!\d)/g, '$1').replace(',', '.'); var x = parseFloat(s); return isFinite(x) ? Math.round(x) : ''; }
  function parseDate(s, italian) {
    s = String(s || '').trim(); if (!s) return '';
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
    m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
    if (m) {
      var a = +m[1], b = +m[2], y = m[3].length === 2 ? '20' + m[3] : m[3];
      var dd, mm;
      if (a > 12) { dd = a; mm = b; } else if (b > 12) { dd = b; mm = a; } else if (italian) { dd = a; mm = b; } else { mm = a; dd = b; }
      return y + '-' + String(mm).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
    }
    var d = new Date(s); return isNaN(d) ? '' : iso(d);
  }
  function parseFmt(s) {
    s = String(s || '').toLowerCase();
    if (/reel|video/.test(s)) return 'Reel';
    if (/carous|carosel|sequenza|album/.test(s)) return 'Carosello';
    if (/stor/.test(s)) return 'Storia';
    return s ? 'Post' : 'Reel';
  }
  function importCSV(file) {
    var r = new FileReader();
    r.onload = function () {
      var rows = parseCSV(String(r.result || ''));
      if (rows.length < 2) { toast('Il file non contiene righe da importare.'); return; }
      var hi = 0;
      for (var i = 0; i < Math.min(rows.length, 5); i++) { var mm = mapHeaders(rows[i]).map; if (mm.data != null && (mm.views != null || mm.reach != null || mm.like != null)) { hi = i; break; } }
      var mh = mapHeaders(rows[hi]), map = mh.map;
      if (map.data == null) { toast('Non trovo la colonna con la data di pubblicazione. Controlla che sia l\'export dei contenuti di Meta.'); return; }
      var added = 0, updated = 0;
      rows.slice(hi + 1).forEach(function (row) {
        function g(k) { return map[k] != null ? row[map[k]] : ''; }
        var d = parseDate(g('data'), mh.italian); if (!d) return;
        var o = { data: d, formato: parseFmt(g('formato')), titolo: String(g('titolo') || '').replace(/\s+/g, ' ').trim().slice(0, 220), link: String(g('link') || '').trim(), pilastro: String(g('pilastro') || '').trim() };
        ['views', 'reach', 'like', 'commenti', 'condivisioni', 'salvataggi', 'follow'].forEach(function (k) { o[k] = parseNum(g(k)); });
        var ex = state.posts.filter(function (p) { return (o.link && p.link === o.link) || (!o.link && p.data === o.data && (p.titolo || '').slice(0, 60) === o.titolo.slice(0, 60)); })[0];
        if (ex) {
          ['views', 'reach', 'like', 'commenti', 'condivisioni', 'salvataggi', 'follow'].forEach(function (k) { if (o[k] !== '') ex[k] = o[k]; });
          if (!ex.titolo && o.titolo) ex.titolo = o.titolo;
          if (!ex.pilastro && o.pilastro) ex.pilastro = o.pilastro;
          updated++;
        } else { o.id = uid(); o.note = ''; state.posts.push(o); added++; }
      });
      if (!added && !updated) { toast('Nessuna riga valida trovata nel file.'); return; }
      save('posts'); render();
      toast(added + ' contenuti aggiunti' + (updated ? ', ' + updated + ' aggiornati' : ''));
    };
    r.onerror = function () { toast('Non riesco a leggere il file.'); };
    r.readAsText(file);
  }
  function csvCell(v) { v = String(v == null ? '' : v); return /[";\n,]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function exportCSV() {
    var h = ['Data', 'Formato', 'Pilastro', 'Titolo', 'Link', 'Visualizzazioni', 'Copertura', 'Mi piace', 'Commenti', 'Condivisioni', 'Salvataggi', 'Nuovi follower', 'Engagement %', 'Note'];

    }));

  }

      return '<article class="sp"><div class="foot"><span class="pill">' + esc(s.tipo) + '</span><span class="muted" style="font-size:12px">' + fmtDate(s.creato) + '</span></div><div class="txt">' + esc(s.testo) + '</div>' +
        (s.link && /^https?:\/\//.test(s.link) ? '<a href="' + esc(s.link) + '" target="_blank" rel="noopener">' + esc(s.link.replace(/^https?:\/\/(www\.)?/, '').slice(0, 60)) + ' ↗</a>' : '') +
        '<div class="foot"><button class="btn small" data-toidea="' + esc(s.id) + '">Trasforma in idea</button><button class="iconbtn" data-rm="' + esc(s.id) + '" aria-label="Elimina spunto">✕</button></div></article>';
    }).join('') + '</div>';
    v.innerHTML = html;
    v.querySelector('#s_add').addEventListener('click', function () {
      var t = v.querySelector('#s_testo').value.trim(); if (!t) { toast('Scrivi lo spunto.'); return; }
      state.spunti.push({ id: uid(), tipo: v.querySelector('#s_tipo').value, testo: t, link: v.querySelector('#s_link').value.trim(), creato: todayISO() });
      save('spunti'); render(); toast('Spunto salvato');
    });
    v.querySelectorAll('#spf [data-t]').forEach(function (b) { b.addEventListener('click', function () { ui.spTipo = b.dataset.t; render(); }); });
    v.querySelectorAll('[data-toidea]').forEach(function (b) { b.addEventListener('click', function () {
      var s = state.spunti.filter(function (x) { return x.id === b.dataset.toidea; })[0];
      var isHook = s.tipo === 'Hook';
      ideaModal(null, { titolo: isHook ? '' : s.testo.slice(0, 120), hook: isHook ? s.testo.slice(0, 160) : '', note: 'Spunto (' + s.tipo + '): ' + s.testo + (s.link ? '\n' + s.link : '') });
    }); });
    v.querySelectorAll('[data-rm]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Elimina?'; b.style.color = 'var(--urgent)'; b.style.fontSize = '12.5px'; b.style.fontWeight = '600'; return; }
        state.spunti = state.spunti.filter(function (x) { return x.id !== b.dataset.rm; }); save('spunti'); render();
      });
    });
  }

  // =====================================================================
  // IMPOSTAZIONI
  // =====================================================================
  function renderImpostazioni(v) {
    var s = state.settings;
    v.innerHTML = '<div class="form">' +
      '<div class="three"><label>Il tuo nome<input class="field" id="st_nome" value="' + esc(s.nome) + '" placeholder="Mattia"></label>' +
      '<label>Profilo Instagram<input class="field" id="st_handle" value="' + esc(s.handle) + '" placeholder="es. mllab.studio"></label>' +
      '<label>Contenuti a settimana<input class="field" type="number" min="1" max="21" id="st_freq" value="' + esc(s.frequenza) + '"></label></div>' +
      '<label>Pilastri di contenuto (uno per riga)<textarea class="field" id="st_pil">' + esc(s.pilastri.join('\n')) + '</textarea></label>' +
      '<label>Pubblico (a chi parli)<input class="field" id="st_pub" value="' + esc(s.pubblico) + '" placeholder="es. donne 25-45 che si allenano in palestra e vogliono gambe più toniche"></label>' +
      '<label>Obiettivo del profilo<input class="field" id="st_obi" value="' + esc(s.obiettivo) + '" placeholder="es. portare richieste di coaching in DM"></label>' +
      '<div><button class="btn primary" id="st_save">Salva impostazioni</button></div>' +
      '<p class="note">Pubblico, obiettivo e pilastri servono a Claude per proporre idee e script su misura. Il formato e il pilastro di ogni contenuto alimentano i confronti in Panoramica.</p>' +
      '<div class="sec-title" style="margin-top:14px"><h2>Collegamento a Instagram</h2></div>' +
      '<p class="note">I numeri arrivano dall\'export di Meta Business Suite: Insights › Contenuti › scegli il periodo › Esporta dati (CSV). Importa lo stesso file anche più volte: i contenuti già presenti vengono aggiornati con i numeri nuovi, senza doppioni. Per un collegamento automatico serve un connettore Instagram in claude.ai: quando sarà disponibile, l\'app potrà leggere i dati direttamente.</p>' +
      '<div class="sec-title" style="margin-top:14px"><h2>Backup</h2></div>' +
      '<p class="note">I dati si sincronizzano da soli tra i tuoi dispositivi quando apri l\'app su claude.ai. Il backup è una copia completa da conservare (non va messo nel repository).</p>' +
      '<div class="bar"><button class="btn" id="bk_exp">Salva backup</button><label class="btn" style="cursor:pointer">Ripristina backup<input type="file" id="bk_imp" accept=".json,application/json" hidden></label></div>' +
      '<p class="note num">' + state.posts.length + ' contenuti · ' + state.ideas.length + ' idee · ' + state.spunti.length + ' spunti · ' + state.crescita.length + ' rilevazioni follower</p>' +
      '</div>';
    v.querySelector('#st_save').addEventListener('click', function () {
      state.settings = {
        nome: val(v, 'st_nome') || 'Mattia',
        handle: val(v, 'st_handle').replace(/^@/, ''),
        frequenza: Math.max(1, n(val(v, 'st_freq')) || 4),
        pilastri: v.querySelector('#st_pil').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean),
        pubblico: val(v, 'st_pub'), obiettivo: val(v, 'st_obi')
      };
      if (!state.settings.pilastri.length) state.settings.pilastri = DEFAULT_SETTINGS.pilastri.slice();
      save('settings'); render(); toast('Impostazioni salvate');
    });
    v.querySelector('#bk_exp').addEventListener('click', function () { saveFile('ML LAB contenuti backup ' + todayISO() + '.json', JSON.stringify(Object.assign({ app: 'mllab-contenuti', versione: 1 }, state), null, 2), 'Backup'); });
    v.querySelector('#bk_imp').addEventListener('change', function (e) {
      var f = e.target.files[0]; e.target.value = ''; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(String(r.result));
          if (d.app !== 'mllab-contenuti') throw new Error('x');
          KEYS.forEach(function (k) { if (d[k]) { state[k] = d[k]; save(k); } });
          state.settings = Object.assign(clone(DEFAULT_SETTINGS), state.settings);
          render(); toast('Backup ripristinato');
        } catch (err) { toast('Questo file non è un backup di ML LAB Contenuti.'); }
      };
      r.readAsText(f);
    });
  }

  // ---------- avvio ----------
  loadLocal();
  var startTab = (location.hash || '').slice(1);
  if (!startTab) { try { startTab = localStorage.getItem(LS_KEY + '-tab') || ''; } catch (e) {} }
  if (['panoramica', 'contenuti', 'idee', 'calendario', 'spunti', 'impostazioni'].indexOf(startTab) >= 0) {
    ui.tab = startTab;
    document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === startTab); });
  }
  render();
  connect();
})();
</script>

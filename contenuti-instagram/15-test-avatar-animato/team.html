<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(anton.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,"Noto Color Emoji",sans-serif}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#e4e7ee}
.abs{position:absolute}
.cap{left:40px;right:40px;top:250px;text-align:center;font-weight:900;font-size:84px;line-height:1.1;color:#fff;-webkit-text-stroke:12px #0b0b0b;paint-order:stroke fill;word-spacing:8px}
.y{color:#ffbf00}
.tag{background:#0b0b0b;color:#ffbf00;font-family:Anton;font-size:46px;padding:8px 26px 12px;border-radius:14px;transform:translateX(-50%);white-space:nowrap}
.role{display:block;font-family:Inter;font-size:22px;font-weight:700;color:#fff;text-align:center}
</style></head><body><div id="st">
 <svg class="abs" width="1080" height="1920" style="left:0;top:0">
  <rect x="0" y="1500" width="1080" height="420" fill="#3a3d46"/><rect x="0" y="1490" width="1080" height="16" fill="#2b2d33"/>
  <rect x="700" y="140" width="380" height="520" fill="#f6f8fc" stroke="#fff" stroke-width="18"/>
  <line x1="890" y1="140" x2="890" y2="660" stroke="#fff" stroke-width="14"/><line x1="700" y1="400" x2="1080" y2="400" stroke="#fff" stroke-width="14"/>
  <rect x="330" y="140" width="300" height="90" rx="14" fill="#0b0b0b"/>
  <text x="480" y="203" text-anchor="middle" font-family="Anton" font-size="56" fill="#ffbf00">ML LAB</text>
  <ellipse cx="190" cy="1500" rx="150" ry="22" fill="#0003"/><ellipse cx="540" cy="1530" rx="170" ry="24" fill="#0003"/><ellipse cx="890" cy="1500" rx="150" ry="22" fill="#0003"/>
 </svg>
 <svg class="abs" id="cS" width="400" height="800" viewBox="0 0 400 800" style="left:-10px;top:740px;overflow:visible"></svg>
 <svg class="abs" id="cG" width="400" height="800" viewBox="0 0 400 800" style="left:690px;top:740px;overflow:visible"></svg>
 <svg class="abs" id="cM" width="460" height="920" viewBox="0 0 400 800" style="left:310px;top:640px;overflow:visible"></svg>
 <div id="cap" class="abs cap">Il team <span class="y">ML LAB</span></div>
 <div id="tS" class="abs tag" style="left:190px;top:1560px">SOFIA</div>
 <div id="tM" class="abs tag" style="left:540px;top:1590px">MATTIA</div>
 <div id="tG" class="abs tag" style="left:890px;top:1560px">GIULIA</div>
</div>
<script src="chars.js"></script>
<script>
document.getElementById('cM').innerHTML=charSVG('m_',CHARS.mattia);
document.getElementById('cS').innerHTML=charSVG('s_',CHARS.sofia);
document.getElementById('cG').innerHTML=charSVG('g_',CHARS.giulia);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const backOut=x=>{const c=1.70158;x=cl(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function wave(t,s,e){return t>=s&&t<e}
window.render=function(t){
 const ppl=[['m_',0,0.3,2.0],['s_',1.3,2.0,3.6],['g_',2.6,3.6,5.2]];
 ppl.forEach(([p,ph,ws,we])=>{
  const w=wave(t,ws,we)||t>=5.4;
  const bp=((t+ph)%3.3); const lid=bp<0.12?34*Math.sin(bp/0.12*Math.PI):0;
  const o={bob:Math.sin((t+ph)*2*Math.PI*1.1)*2.4,head:Math.sin((t+ph)*2.3)*3,uL:8,uR:-8,lid,look:0,mouth:3};
  if(w){o.uR=-150;o.fR=-25+Math.sin(t*14)*20;o.mouth=7+Math.max(0,Math.sin(t*18))*7;o.head=6;}
  if(t>=5.4){o.uL=150;o.fL=25-Math.sin(t*14)*20;o.head=0;}
  poseChar(p,o);
 });
 const tags=[['tS',2.0],['tM',0.3],['tG',3.6]];
 tags.forEach(([id,st])=>{const k=cl(backOut((t-st)/.35),0,1.1);document.getElementById(id).style.transform=`translateX(-50%) scale(${k})`;});
 const k=backOut(t/.35);document.getElementById('cap').style.transform=`scale(${0.6+0.4*Math.min(k,1.08)})`;
};
render(0);
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(anton.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,"Noto Color Emoji",sans-serif}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#dfe3ea}
.abs{position:absolute}
.cap{left:40px;right:40px;top:250px;text-align:center;font-family:Inter;font-weight:900;font-size:84px;line-height:1.1;color:#fff;
 -webkit-text-stroke:12px #0b0b0b;paint-order:stroke fill;letter-spacing:0;word-spacing:8px}
.cap .y{color:#ffbf00}
.label{left:50%;top:470px;z-index:5;transform:translateX(-50%);background:#fff;border-radius:22px;padding:18px 34px;font-weight:900;font-size:46px;color:#0b0b0b;box-shadow:0 8px 0 #0b0b0b22;white-space:nowrap}
.bub{width:200px;height:200px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:120px;box-shadow:0 10px 0 #0002}
.list{right:30px;top:720px;width:440px;background:#fff;border-radius:26px;padding:26px 28px;box-shadow:0 10px 0 #0b0b0b22}
.it{display:flex;gap:16px;align-items:center;font-size:34px;font-weight:800;color:#0b0b0b;margin:10px 0}
.ck{flex:none;width:52px;height:52px;border-radius:50%;background:#ffbf00;display:flex;align-items:center;justify-content:center;font:900 30px Inter}
</style></head><body><div id="st">
 <!-- background gym -->
 <svg class="abs" width="1080" height="1920" style="left:0;top:0">
  <rect x="0" y="0" width="1080" height="1500" fill="#e4e7ee"/>
  <rect x="0" y="1500" width="1080" height="420" fill="#3a3d46"/>
  <rect x="0" y="1490" width="1080" height="16" fill="#2b2d33"/>
  <!-- window -->
  <rect x="700" y="140" width="380" height="520" fill="#f6f8fc" stroke="#fff" stroke-width="18"/>
  <line x1="890" y1="140" x2="890" y2="660" stroke="#fff" stroke-width="14"/><line x1="700" y1="400" x2="1080" y2="400" stroke="#fff" stroke-width="14"/>
  <!-- rack left -->
  <rect x="40" y="420" width="34" height="1090" rx="8" fill="#555a66"/><rect x="230" y="420" width="34" height="1090" rx="8" fill="#555a66"/>
  <rect x="40" y="420" width="224" height="26" fill="#555a66"/>
  <rect x="20" y="900" width="270" height="14" rx="7" fill="#9aa0ab"/>
  <rect x="0" y="870" width="40" height="74" rx="8" fill="#2b2d33"/><rect x="264" y="870" width="40" height="74" rx="8" fill="#2b2d33"/>
  <!-- dumbbell rack right -->
  <rect x="790" y="1300" width="260" height="20" rx="6" fill="#555a66"/><rect x="800" y="1320" width="16" height="180" fill="#555a66"/><rect x="1024" y="1320" width="16" height="180" fill="#555a66"/>
  <g fill="#2b2d33"><rect x="810" y="1262" width="40" height="40" rx="8"/><rect x="870" y="1262" width="40" height="40" rx="8"/><rect x="930" y="1258" width="44" height="44" rx="8"/><rect x="990" y="1256" width="46" height="46" rx="8"/></g>
  <!-- brand banner -->
  <rect x="330" y="140" width="300" height="90" rx="14" fill="#0b0b0b"/>
  <text x="480" y="203" text-anchor="middle" font-family="Anton" font-size="56" fill="#ffbf00">ML LAB</text>
  <ellipse cx="540" cy="1775" rx="270" ry="36" fill="#0003"/>
 </svg>

 <!-- avatar -->
 <svg id="av" class="abs" width="680" height="1360" viewBox="0 0 400 800" style="left:200px;top:500px;overflow:visible">
  <g id="body">
   <!-- legs -->
   <path d="M140 470 L132 735 L192 735 L198 520 L202 520 L208 735 L268 735 L260 470 Z" fill="#1d1f24"/>
   <line x1="200" y1="520" x2="200" y2="735" stroke="#33363d" stroke-width="3"/>
   <ellipse cx="160" cy="745" rx="46" ry="20" fill="#f4f4f4"/><ellipse cx="240" cy="745" rx="46" ry="20" fill="#f4f4f4"/>
   <!-- arm left (viewer left) -->
   <!-- torso tee -->
   <path d="M100 268 Q200 236 300 268 L306 330 L276 336 L262 480 L138 480 L124 336 L94 330 Z" fill="#ffffff" stroke="#d9d9d9" stroke-width="3"/>
   <path d="M150 318 Q175 336 198 322 M202 322 Q225 336 250 318" fill="none" stroke="#d9d9d9" stroke-width="4"/>
   <path d="M175 252 Q200 275 225 252" fill="none" stroke="#d9d9d9" stroke-width="5"/>
   <rect x="168" y="360" width="64" height="24" rx="5" fill="#0b0b0b"/><text x="200" y="378" text-anchor="middle" font-family="Anton" font-size="17" fill="#ffbf00">ML LAB</text>
   <g id="armL" style="transform-origin:106px 288px">
     <rect x="81" y="296" width="50" height="94" rx="25" fill="#d9a47a"/>
     <ellipse cx="106" cy="336" rx="27" ry="34" fill="#d9a47a"/>
     <g id="foreL" style="transform-origin:106px 384px">
       <rect x="85" y="376" width="42" height="98" rx="21" fill="#d9a47a"/>
       <circle cx="106" cy="484" r="24" fill="#d9a47a"/>
     </g>
     <path d="M76 270 Q106 256 136 270 L136 322 L76 322 Z" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>
   </g>
   <g id="armR" style="transform-origin:294px 288px">
     <rect x="269" y="296" width="50" height="94" rx="25" fill="#d9a47a"/>
     <ellipse cx="294" cy="336" rx="27" ry="34" fill="#d9a47a"/>
     <g id="foreR" style="transform-origin:294px 384px">
       <rect x="273" y="376" width="42" height="98" rx="21" fill="#d9a47a"/>
       <circle cx="294" cy="484" r="24" fill="#d9a47a"/>
     </g>
     <path d="M264 270 Q294 256 324 270 L324 322 L264 322 Z" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>
   </g>
   <!-- neck -->
   <rect x="176" y="212" width="48" height="46" rx="12" fill="#d9a47a"/>
   <!-- head -->
   <g id="head" style="transform-origin:200px 230px">
     <ellipse cx="200" cy="150" rx="70" ry="82" fill="#e2b088"/>
     <ellipse cx="128" cy="158" rx="12" ry="20" fill="#d9a47a"/><ellipse cx="272" cy="158" rx="12" ry="20" fill="#d9a47a"/>
     <path d="M150 205 Q200 245 250 205" fill="none" stroke="#c9946c" stroke-width="3" opacity=".5"/>
     <!-- mouth -->
     <ellipse id="mouth" cx="200" cy="200" rx="16" ry="5" fill="#6b2a2a"/>
     <!-- nose -->
     <path d="M200 150 Q192 178 200 182 Q208 180 206 176" fill="none" stroke="#b8845e" stroke-width="4" stroke-linecap="round"/>
     <!-- eyes -->
     <g id="eyes">
       <ellipse cx="172" cy="140" rx="15" ry="15" fill="#fff"/><ellipse cx="228" cy="140" rx="15" ry="15" fill="#fff"/>
       <circle id="pL" cx="174" cy="142" r="8" fill="#2a1d14"/><circle id="pR" cx="230" cy="142" r="8" fill="#2a1d14"/>
     </g>
     <rect id="lidL" x="155" y="122" width="34" height="0" fill="#e2b088"/><rect id="lidR" x="211" y="122" width="34" height="0" fill="#e2b088"/>
     <path id="browL" d="M154 118 Q172 108 190 116" fill="none" stroke="#2c1f17" stroke-width="8" stroke-linecap="round"/>
     <path id="browR" d="M210 116 Q228 108 246 118" fill="none" stroke="#2c1f17" stroke-width="8" stroke-linecap="round"/>
     <!-- curly hair -->
     <g fill="#2c1f17">
       <circle cx="140" cy="100" r="28"/><circle cx="165" cy="76" r="30"/><circle cx="200" cy="66" r="32"/><circle cx="236" cy="76" r="30"/><circle cx="260" cy="100" r="28"/>
       <circle cx="130" cy="128" r="18"/><circle cx="270" cy="128" r="18"/><circle cx="182" cy="90" r="24"/><circle cx="218" cy="90" r="24"/>
     </g>
     <g fill="#46342a"><circle cx="160" cy="70" r="9"/><circle cx="205" cy="58" r="10"/><circle cx="245" cy="78" r="8"/></g>
   </g>
  </g>
 </svg>

 <div id="cap" class="abs cap"></div>
 <div id="lab" class="abs label"></div>
 <div id="q" class="abs bub" style="left:60px;top:780px"><span style="color:#ff3b3b;font-family:Anton">?</span></div>
 <div id="emo" class="abs" style="left:40px;top:1020px;font-size:190px">😮</div>
 <div id="x" class="abs" style="left:700px;top:760px;font-family:Anton;font-size:300px;color:#ff3b3b;-webkit-text-stroke:12px #fff;paint-order:stroke fill">✕</div>
 <div id="list" class="abs list" style="z-index:4">
   <div class="it" id="i1"><div class="ck">✓</div>Appoggio del piede</div>
   <div class="it" id="i2"><div class="ck">✓</div>Bacino stabile</div>
   <div class="it" id="i3"><div class="ck">✓</div>Carico che cresce</div>
 </div>
 <div id="follow" hidden class="abs" style="left:90px;right:90px;top:1680px;background:#ffbf00;border-radius:26px;padding:22px;text-align:center;font-weight:900;font-size:46px;color:#0b0b0b;box-shadow:0 10px 0 #0b0b0b">Seguimi per la parte 2 👉</div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const backOut=x=>{const c=1.70158;x=cl(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function pop(t,s,e,d=.35){ if(t<s||t>e) return 0; const a=backOut((t-s)/d); const b=e-t<.2? (e-t)/.2:1; return Math.min(a,1.15)*b;}
const S=[
 [0,2.6,'Perché i tuoi <span class="y">glutei</span><br>non crescono?','LA DOMANDA DI OGGI'],
 [2.6,5.6,'Fai 100 squat<br>a settimana…','…ma niente 😩'],
 [5.6,8.6,'Il problema non è<br><span class="y">QUANTO</span> ti alleni','❌ PIÙ NON È MEGLIO'],
 [8.6,11.8,'…ma <span class="y">COME</span><br>ti alleni','I 3 PUNTI CHE GUARDO'],
 [11.8,14.5,'Ogni corpo è diverso:<br>l\'esercizio si <span class="y">adatta</span>','👇 SEGUIMI PER LA PARTE 2'],
];
function lerp(a,b,x){return a+(b-a)*cl(x)}
window.render=function(t){
 let si=S.findIndex(s=>t>=s[0]&&t<s[1]); if(si<0) si=S.length-1; const s=S[si];
 const lt=t-s[0];
 const cap=$('cap'); if(cap.dataset.i!=si){cap.innerHTML=s[2];$('lab').textContent=s[3];cap.dataset.i=si;}
 const k=backOut(lt/.3); cap.style.transform=`scale(${0.6+0.4*Math.min(k,1.08)})`;
 const kl=backOut((lt-.15)/.3); $('lab').style.transform=`translateX(-50%) scale(${cl(kl,0,1.1)})`;
 // avatar idle
 const bob=Math.sin(t*2*Math.PI*1.1)*6;
 $('body').setAttribute('transform',`translate(0 ${bob*0.4})`);
 let headRot=Math.sin(t*2.3)*3, uL=8,fL=0,uR=-8,fR=0;
 if(si==0){ uR=-100; fR=-60+Math.sin(t*14)*22; }
 if(si==1){ uR=12; fR=160; uL=10; headRot=-8+Math.sin(t*1.5)*2; }
 if(si==2){ headRot=Math.sin(t*12)*9; uL=30;fL=70; uR=-30;fR=-70; }
 if(si==3){ uR=-95; fR=-5; uL=10; headRot=6; }
 if(si==4){ uR=-140;fR=-20+Math.sin(t*14)*15; uL=140;fL=20-Math.sin(t*14)*15; }
 $('armL').style.transform=`rotate(${uL}deg)`; $('armR').style.transform=`rotate(${uR}deg)`; $('foreL').style.transform=`rotate(${fL}deg)`; $('foreR').style.transform=`rotate(${fR}deg)`;
 $('head').style.transform=`rotate(${headRot}deg)`;
 // talking mouth
 const talk=(Math.sin(t*22)+Math.sin(t*13.7))*0.5; $('mouth').setAttribute('ry',(4+Math.max(0,talk)*10).toFixed(1));
 // blink
 const bp=(t%3.1); const lid=bp<0.12? 34*Math.sin(bp/0.12*Math.PI):0; ['lidL','lidR'].forEach(i=>$(i).setAttribute('height',lid));
 // eyes look direction
 const lx= si==3? 4 : si==1? -3:0; $('pL').setAttribute('cx',174+lx); $('pR').setAttribute('cx',230+lx);
 // brows
 const by= si==2? 6: si==1? -6:0; $('browL').setAttribute('transform',`translate(0 ${by}) rotate(${si==2?10:0} 172 114)`); $('browR').setAttribute('transform',`translate(0 ${by}) rotate(${si==2?-10:0} 228 114)`);
 // props
 const pq=pop(t,2.8,5.6); $('q').style.transform=`scale(${pq}) rotate(${Math.sin(t*4)*8}deg)`;
 const pe=pop(t,3.2,5.6); $('emo').style.transform=`scale(${pe})`;
 const px=pop(t,6.0,8.6); $('x').style.transform=`scale(${px}) rotate(${(1-cl((t-6)/.35))*-30}deg)`;
 const pl=pop(t,9.0,11.8); $('list').style.transform=`scale(${pl})`; $('list').style.transformOrigin='left center';
 [['i1',9.4],['i2',10.1],['i3',10.8]].forEach(([id,st])=>{const p=cl((t-st)/.25);$(id).style.opacity=p;$(id).style.transform=`translateX(${(1-p)*40}px)`;});
 const pf=pop(t,12.2,14.6); $('follow').style.transform=`scale(${pf})`;
 // avatar slight shift when list visible
 $('av').style.left=(200+(si==3?lerp(0,-190,(t-8.8)/.4):0))+'px';
};
render(0);
</script></body></html>

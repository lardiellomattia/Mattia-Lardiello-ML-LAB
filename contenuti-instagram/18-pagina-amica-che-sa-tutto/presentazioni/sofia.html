<!doctype html><html><head><meta charset="utf-8"><style>

.q{font-family:Anton;font-size:130px;color:#ffbf00;-webkit-text-stroke:6px #0b0b0b;paint-order:stroke fill}

<script>
document.getElementById('cS').innerHTML=charSVG('s_',CHARS.sofia);
const TL=__TL__;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const backOut=x=>{const c=1.70158;x=cl(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const L=TL.lines;
window.render=function(t){
 const fi=Math.min(Math.round(t*30),TL.env.length-1); const mv=TL.env[fi]||0;
 const endT=L[3][1]+1.4; $('end').style.display=t>=endT?'flex':'none';
 if(t>=endT){ $('end').firstElementChild.style.transform=`scale(${cl(backOut((t-endT)/.35),0,1.1)}) rotate(${Math.sin(t*5)*8}deg)`; return; }
 const nk=cl(backOut((t-0.15)/.4),0,1.08); $('nm').style.transform=`translateX(-50%) scale(${nk})`; $('nm').style.opacity=t<L[1][0]?1:Math.max(0,1-(t-L[1][0])/0.25);
 [['c1',L[1][0]+1.4],['c2',L[1][0]+1.9],['c3',L[1][0]+2.4],['c4',L[1][0]+2.9]].forEach(([id,st],i)=>{const on=t>=st&&t<L[2][0];$(id).style.display=on?'':'none';if(on)$(id).style.transform=`scale(${cl(backOut((t-st)/.3),0,1.1)}) rotate(${Math.sin(t*3+i)*5}deg) translateY(${Math.sin(t*2+i)*8}px)`;});
 [['q1',L[2][0]+0.2],['q2',L[2][0]+0.6],['q3',L[2][0]+1.0]].forEach(([id,st],i)=>{const on=t>=st&&t<L[3][0]-0.1;$(id).style.display=on?'':'none';if(on)$(id).style.transform=`scale(${cl(backOut((t-st)/.3),0,1.1)}) rotate(${Math.sin(t*4+i)*12}deg)`;});
 let txt=null,bs=0;
 if(t>=L[2][0]-0.1&&t<L[3][0]-0.1){txt='Il problema? Non so mai se sono <span class=y>veri</span>! 😩';bs=L[2][0]-0.1;}
 if(t>=L[3][0]-0.1){txt='Allora… chiedo a <span class=y>Mattia</span>! 💪';bs=L[3][0]-0.1;}
 if(txt){$('bub').style.display='';if($('bub').dataset.t!=txt){$('bub').innerHTML=txt;$('bub').dataset.t=txt;}$('bub').style.transform=`scale(${cl(backOut((t-bs)/.3),0,1.06)})`;}else $('bub').style.display='none';
 const bp=(t%3.2); const lid=bp<0.12?34*Math.sin(bp/0.12*Math.PI):0;
 const o={uL:8,uR:-8,mouth:2.5+mv*12,lid,bob:Math.sin(t*2*Math.PI*1.1)*2.4,head:Math.sin(t*2.3)*3};
 if(t<L[1][0]){o.uR=-150;o.fR=-25+Math.sin(t*14)*20;}
 else if(t<L[2][0]){o.uL=30;o.fL=80;o.uR=-30;o.fR=-80;o.head=Math.sin(t*3)*6;o.look=Math.sin(t*2)*5;}
 else if(t<L[3][0]){o.uR=12;o.fR=160;o.head=-9;o.look=-4;}
 else {o.uR=-100;o.fR=-60;o.head=6;o.look=5;}
 poseChar('s_',o);
};
render(0);
</script></body></html>
